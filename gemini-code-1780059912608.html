<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sweet Portfolio</title>
    <style>
        :root {
            --bg-color: #fdf6f0; /* 奶油色背景 */
            --card-bg: #ffffff;
            --primary-pink: #ffafcc; /* 櫻花粉 */
            --primary-blue: #a2d2ff; /* 天空藍 */
            --text-color: #5f5f5f;
            --accent-purple: #cdb4db;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        header {
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.2rem;
            color: #ff85a1;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        header p {
            font-size: 1rem;
            color: #999;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .item-card {
            background: var(--card-bg);
            text-decoration: none;
            color: inherit;
            padding: 20px;
            border-radius: 25px; /* 超圓角設計 */
            box-shadow: 0 8px 20px rgba(255, 175, 204, 0.15); /* 粉色系軟陰影 */
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .item-card:hover {
            transform: scale(1.03) translateY(-3px);
            border-color: var(--primary-pink);
            box-shadow: 0 12px 25px rgba(255, 175, 204, 0.25);
        }

        .icon-box {
            width: 50px;
            height: 50px;
            background: var(--bg-color);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            margin-right: 20px;
            flex-shrink: 0;
        }

        .text-content {
            text-align: left;
        }

        .text-content h2 {
            font-size: 1.1rem;
            margin-bottom: 4px;
            color: #444;
        }

        .text-content p {
            font-size: 0.85rem;
            color: #a0a0a0;
        }

        footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: var(--primary-pink);
            letter-spacing: 1px;
        }

        /* 每一列的小圖示背景色循環 */
        .item-card:nth-child(1) .icon-box { background: #ffecf2; }
        .item-card:nth-child(2) .icon-box { background: #e0f2ff; }
        .item-card:nth-child(3) .icon-box { background: #f0eaff; }
        .item-card:nth-child(4) .icon-box { background: #e8f7ee; }
        .item-card:nth-child(5) .icon-box { background: #fff5e6; }

        @media (max-width: 480px) {
            header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>My Little World ✨</h1>
        <p>歡迎來到我的數位收藏盒</p>
    </header>

    <div class="links-wrapper">
        <a href="https://bhes109106-eng.github.io/fm41o4ej-rm4/" class="item-card" target="_blank">
            <div class="icon-box">🪄</div>
            <div class="text-content">
                <h2>去背小幫手</h2>
                <p>幫你的照片變透明～</p>
            </div>
        </a>

        <a href="https://bhes109106-eng.github.io/test/" class="item-card" target="_blank">
            <div class="icon-box">💎</div>
            <div class="text-content">
                <h2>芙莉蓮：大考驗</h2>
                <p>看看你對這部作品了解多少？</p>
            </div>
        </a>

        <a href="https://bhes109106-eng.github.io/comics/" class="item-card" target="_blank">
            <div class="icon-box">🧸</div>
            <div class="text-content">
                <h2>POPMART 敘事展</h2>
                <p>藏在盲盒裡的藝術故事</p>
            </div>
        </a>

        <a href="https://bhes109106-eng.github.io/-/" class="item-card" target="_blank">
            <div class="icon-box">🎵</div>
            <div class="text-content">
                <h2>星光共享歌單</h2>
                <p>聽聽那些觸動靈魂的旋律</p>
            </div>
        </a>

        <a href="https://bhes109106-eng.github.io/p5.js-/" class="item-card" target="_blank">
            <div class="icon-box">⭐</div>
            <div class="text-content">
                <h2>星流互動藝術</h2>
                <p>玩玩看指尖流動的小星星</p>
            </div>
        </a>
    </div>

    <footer>
        MADE WITH ♡ BY YIHUA
    </footer>
</div>

</body>
</html>
